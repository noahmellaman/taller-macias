<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Mecánicos | Automóviles Macías</title>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #080b10;
      --card: #101622;
      --accent: #ff6b00;
      --border: rgba(255, 255, 255, 0.1);
      --text: #f1f5f9;
      --text-muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 20px; min-height: 100vh; display: flex; flex-direction: column; align-items: center; }
    .container { width: 100%; max-width: 800px; display: flex; flex-direction: column; gap: 20px; }
    
    header { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; display: flex; justify-content: space-between; align-items: center; }
    h1 { font-family: 'Chakra Petch', sans-serif; font-size: 1.5rem; color: #ffffff; }
    .badge-taller { background: rgba(255,107,0,0.15); color: var(--accent); padding: 6px 12px; border-radius: 8px; font-weight: bold; font-size: 0.85rem; border: 1px solid var(--accent); }

    .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
    .card-title { font-family: 'Chakra Petch', sans-serif; font-size: 1.1rem; color: var(--accent); text-transform: uppercase; }

    .form-group { display: flex; flex-direction: column; gap: 6px; }
    label { font-size: 0.85rem; color: var(--text-muted); font-weight: 600; }
    input, select, textarea { background: #090d14; border: 1px solid var(--border); border-radius: 8px; padding: 12px; color: #fff; font-size: 1rem; outline: none; width: 100%; }
    input:focus, select:focus, textarea:focus { border-color: var(--accent); }

    .btn { background: linear-gradient(135deg, #ff6b00 0%, #d95200 100%); color: #fff; border: none; padding: 14px; border-radius: 8px; font-weight: bold; font-family: 'Chakra Petch', sans-serif; font-size: 1.05rem; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; }
    .btn:hover { opacity: 0.9; }

    .upload-box { background: rgba(255, 255, 255, 0.02); border: 1px dashed var(--border); padding: 14px; border-radius: 8px; display: flex; flex-direction: column; gap: 10px; }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div>
        <h1>🛠️ Panel de Mecánicos</h1>
        <p style="font-size: 0.85rem; color: var(--text-muted);">Automóviles Macías - Gestión Interna</p>
      </div>
      <div class="badge-taller">TALLER ACTIVO</div>
    </header>

    <!-- SECCIÓN: ACTUALIZAR ESTADO Y NOTAS -->
    <div class="card">
      <div class="card-title">1. Actualizar Estado de Vehículo</div>
      <div class="form-group">
        <label>Matrícula del vehículo:</label>
        <input type="text" id="targetPlate" placeholder="Ej: 1234ABC" style="text-transform: uppercase;">
      </div>
      <div class="form-group">
        <label>Nuevo Estado:</label>
        <select id="newStatus">
          <option value="espera">1. Recepción (En espera)</option>
          <option value="diagnostico">2. En Diagnóstico</option>
          <option value="presupuesto">3. Presupuesto / Recambios</option>
          <option value="proceso">4. En Reparación</option>
          <option value="prueba">5. En Prueba</option>
          <option value="terminado">6. Listo para Recoger</option>
        </select>
      </div>
      <div class="form-group">
        <label>Nota para el cliente (opcional):</label>
        <textarea id="workshopNotes" rows="2" placeholder="Ej: Culata rectificada, esperando junta nueva..."></textarea>
      </div>
      <button class="btn" onclick="updateStatus()">Guardar Cambios</button>
    </div>

    <!-- SECCIÓN: SUBIR FOTOS A DRIVE -->
    <div class="card">
      <div class="card-title">2. Subir Fotos de Avance (Drive del Taller)</div>
      <div class="upload-box">
        <div class="form-group">
          <label>Seleccionar Foto (o hacer foto con la cámara del móvil):</label>
          <input type="file" id="photoFileInput" accept="image/*" capture="environment">
        </div>
        <div class="form-group">
          <label>Descripción de la foto:</label>
          <input type="text" id="photoComment" placeholder="Ej: Estado actual de la culata">
        </div>
        <button class="btn" onclick="uploadPhoto()" style="background: #2563eb;">Subir Foto a Google Drive</button>
      </div>
    </div>
  </div>

  <script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbz1tzWOHfahpYJyQNeT2La7KtRiMRK2L8fYKaaWjwpJXUti7Px8VL_s6Qnk2hg-h9SU/exec";

    async function updateStatus() {
      const plate = document.getElementById('targetPlate').value.trim().toUpperCase();
      const status = document.getElementById('newStatus').value;
      const notes = document.getElementById('workshopNotes').value.trim();

      if (!plate) {
        alert("Por favor, introduce la matrícula.");
        return;
      }

      const payload = {
        action: "updateStatus",
        plate: plate,
        status: status,
        notes: notes
      };

      alert("Actualizando estado...");

      try {
        const response = await fetch(WEB_APP_URL, {
          method: "POST",
          body: JSON.stringify(payload)
        });
        const result = await response.json();
        if (result.result === "success") {
          alert("¡Estado actualizado con éxito!");
          document.getElementById('workshopNotes').value = "";
        } else {
          alert("Error al actualizar.");
        }
      } catch (err) {
        console.error(err);
        alert("Error de conexión.");
      }
    }

    async function uploadPhoto() {
      const plate = document.getElementById('targetPlate').value.trim().toUpperCase();
      const fileInput = document.getElementById('photoFileInput');
      const commentInput = document.getElementById('photoComment');

      if (!plate) {
        alert("Introduce primero la matrícula arriba del coche que estás reparando.");
        return;
      }

      if (!fileInput.files || fileInput.files.length === 0) {
        alert("Por favor, selecciona una foto o haz una foto con la cámara.");
        return;
      }

      const file = fileInput.files[0];
      const reader = new FileReader();

      reader.onload = async function(e) {
        const base64Image = e.target.result;
        
        const payload = {
          action: "uploadPhoto",
          plate: plate,
          imageData: base64Image,
          comment: commentInput.value || "Avance de reparación"
        };

        alert("Subiendo imagen al Google Drive del taller...");

        try {
          const res = await fetch(WEB_APP_URL, {
            method: "POST",
            body: JSON.stringify(payload)
          });
          const data = await res.json();
          if (data.result === "success") {
            alert("¡Foto subida correctamente a Drive! Ya aparece en el portal del cliente.");
            fileInput.value = "";
            commentInput.value = "";
          } else {
            alert("Error al subir la foto.");
          }
        } catch (err) {
          console.error(err);
          alert("Error de conexión al subir la imagen.");
        }
      };

      reader.readAsDataURL(file);
    }
  </script>
</body>
</html>
